appId: local.cue.copilot
productName: Cue
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/koffi/**/*
  - node_modules/@koromix/**/*
extraResources:
  - from: config.yaml
    to: config.default.yaml
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
portable:
  artifactName: Cue-portable-${version}.exe
